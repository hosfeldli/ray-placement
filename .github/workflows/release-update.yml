name: Build and stage Lima release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft tag to build and stage (for example v3.12.6)
        required: true
        type: string
permissions: {}

jobs:
  build-and-stage:
    runs-on: macos-15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RAYPLACEMENT_REQUIRE_STABLE_SIGNING: "1"
      RAYPLACEMENT_SIGNING_MODE: self-signed-local
      LIMA_RELEASE_EXPECTED_REF: refs/remotes/origin/ci-immutable-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
          # Harper is a versioned Apple-silicon binary stored in Git LFS.
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Configure ephemeral signing directory
        shell: bash
        env:
          SIGNING_DIRECTORY: ${{ runner.temp }}/lima-signing
        run: |
          set -euo pipefail
          printf 'RAYPLACEMENT_SIGNING_DIRECTORY=%s\n' "$SIGNING_DIRECTORY" >> "$GITHUB_ENV"

      - name: Import CI signing P12
        shell: bash
        env:
          SIGNING_P12_B64: ${{ secrets.LIMA_SIGNING_P12_B64 }}
          SIGNING_PASSWORD: ${{ secrets.LIMA_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_P12_B64" || { echo 'Missing LIMA_SIGNING_P12_B64 repository secret.' >&2; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo 'Missing LIMA_SIGNING_P12_PASSWORD repository secret.' >&2; exit 1; }
          mkdir -p "$RAYPLACEMENT_SIGNING_DIRECTORY"
          P12_PATH="$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementSigning.p12"
          KEYCHAIN_PATH="$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementSigning.keychain-db"
          printf '%s' "$SIGNING_P12_B64" | base64 --decode > "$P12_PATH"
          printf '%s\n' "$SIGNING_PASSWORD" > "$RAYPLACEMENT_SIGNING_DIRECTORY/keychain-password"
          security create-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          # Make the ephemeral keychain the active search source for codesign.
          # GitHub-hosted runners do not necessarily search newly-created
          # keychains, even when the import itself succeeds.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          printf 'Decoded P12 bytes: '
          stat -f '%z' "$P12_PATH"
          printf 'Decoded P12 SHA-256: '
          shasum -a 256 "$P12_PATH" | awk '{print $1}'
          set +e
          security import "$P12_PATH" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          import_status=$?
          security find-certificate -a -p -c 'RayPlacement Local Code Signing' "$KEYCHAIN_PATH" > "$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementLocalSigning.cer"
          # Trust the self-signed certificate in the disposable runner System
          # keychain. Using the administrative trust domain avoids SecurityAgent
          # and makes security find-identity classify the imported identity as
          # valid; the GitHub-hosted runner is destroyed after this job.
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementLocalSigning.cer"
          trust_status=$?
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$SIGNING_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          partition_status=$?
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          identity_status=$?
          set -e
          printf 'security import exit: %s\n' "$import_status"
          printf 'certificate trust exit: %s\n' "$trust_status"
          printf 'partition-list exit: %s\n' "$partition_status"
          printf 'find-identity exit: %s\n' "$identity_status"
          identity_output="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null || true)"
          printf '%s\n' "$identity_output" | grep -F '"RayPlacement Local Code Signing"' >/dev/null || {
            echo 'Imported keychain does not contain the pinned RayPlacement Local Code Signing identity.' >&2
            exit 1
          }
          [[ "$import_status" == 0 && "$trust_status" == 0 && "$partition_status" == 0 && "$identity_status" == 0 ]] || {
            echo 'CI signing keychain setup failed.' >&2
            exit 1
          }
          chmod 600 "$RAYPLACEMENT_SIGNING_DIRECTORY"/*

      - name: Verify source tag and signing policy
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ./scripts/check_release_consistency.sh
          # The checked-out release is an annotated tag. Provide the tagged
          # preflight helper with a temporary remote-style commit ref so its
          # legacy CI gate compares commit-to-commit without dereferencing the
          # annotated tag object.
          git update-ref refs/remotes/origin/ci-immutable-release "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_TAG")"
          ./scripts/release_assert_tag_identity.sh --tag "$RELEASE_TAG"
          ./scripts/release_preflight.sh --tag "$RELEASE_TAG"

      - name: Build local artifacts without Git mutation
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          LIMA_RELEASE_SKIP_PREFLIGHT: "1"
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./scripts/release_build.sh --tag "$RELEASE_TAG"

      - name: Stage the existing draft
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ./scripts/release_stage.sh --tag "$RELEASE_TAG"
          ./scripts/release_verify.sh --tag "$RELEASE_TAG" --remote-only

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RAYPLACEMENT_SIGNING_DIRECTORY:-}/RayPlacementSigning.keychain-db"
          if [[ -n "${RAYPLACEMENT_SIGNING_DIRECTORY:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf -- "$RAYPLACEMENT_SIGNING_DIRECTORY"
          fi
