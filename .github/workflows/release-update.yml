name: Publish Update Kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Harper is a versioned Apple-silicon binary stored in Git LFS. A
          # release bundle must contain the binary, never its small LFS pointer.
          lfs: true
      - name: Verify version and tests
        shell: zsh {0}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION."
            exit 1
          fi
          make test
          ./scripts/test_lima_installer.sh
          /bin/zsh scripts/test_approved_lima_update.sh
      - name: Create update kit and ready-to-drag DMG
        run: |
          RAYPLACEMENT_MODEL_FREE_UPDATE=1 RAYPLACEMENT_DISABLE_LOCAL_SIGNING=1 RAYPLACEMENT_SKIP_PACKAGING_VERIFICATION=1 ./scripts/package_liamflow_app.sh
          ./scripts/create_update_archive.sh dist
          RAYPLACEMENT_DISABLE_LOCAL_SIGNING=1 RAYPLACEMENT_SKIP_PACKAGING_VERIFICATION=1 ./scripts/package_liamflow_app.sh
          ./scripts/create_liamflow_dmg.sh dist
      - name: Stage GitHub Release assets for review
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never overwrite a published, reviewed bundle with CI's ad-hoc copy.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)" = false ]; then
            echo "This release is already published; leaving its verified assets unchanged."
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Lima $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/Lima-Update.zip dist/Lima-Update.sha256 dist/Lima.dmg dist/Lima.dmg.sha256 --clobber
