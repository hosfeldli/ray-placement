name: Build and stage Lima release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft tag to build and stage (for example v3.12.6)
        required: true
        type: string
      signing_mode:
        description: Explicit signing policy configured in repository secrets
        required: true
        default: self-signed-local
        type: choice
        options:
          - self-signed-local
          - developer-id

permissions: {}

jobs:
  build-and-stage:
    runs-on: macos-15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RAYPLACEMENT_REQUIRE_STABLE_SIGNING: "1"
      RAYPLACEMENT_SIGNING_MODE: ${{ inputs.signing_mode }}
      RAYPLACEMENT_SIGNING_IDENTITY: ${{ secrets.LIMA_SIGNING_IDENTITY }}
      RAYPLACEMENT_EXPECTED_TEAM_IDENTIFIER: ${{ secrets.LIMA_TEAM_IDENTIFIER }}
      RAYPLACEMENT_EXPECTED_SIGNING_IDENTITY: ${{ secrets.LIMA_SIGNING_IDENTITY }}
      RAYPLACEMENT_EXPECTED_CERTIFICATE_SHA256: ${{ secrets.LIMA_CERTIFICATE_SHA256 }}
      RAYPLACEMENT_SIGNING_DIRECTORY: ${{ runner.temp }}/lima-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Harper is a versioned Apple-silicon binary stored in Git LFS.
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Import CI signing keychain
        if: ${{ inputs.signing_mode == 'self-signed-local' }}
        shell: bash
        env:
          SIGNING_KEYCHAIN_B64: ${{ secrets.LIMA_SIGNING_KEYCHAIN_B64 }}
          SIGNING_PASSWORD: ${{ secrets.LIMA_SIGNING_KEYCHAIN_PASSWORD }}
          SIGNING_CERTIFICATE_B64: ${{ secrets.LIMA_SIGNING_CERTIFICATE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYCHAIN_B64"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_CERTIFICATE_B64"
          mkdir -p "$RAYPLACEMENT_SIGNING_DIRECTORY"
          printf '%s' "$SIGNING_KEYCHAIN_B64" | base64 --decode > "$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementSigning.keychain-db"
          printf '%s\n' "$SIGNING_PASSWORD" > "$RAYPLACEMENT_SIGNING_DIRECTORY/keychain-password"
          printf '%s' "$SIGNING_CERTIFICATE_B64" | base64 --decode > "$RAYPLACEMENT_SIGNING_DIRECTORY/RayPlacementLocalSigning.cer"
          chmod 600 "$RAYPLACEMENT_SIGNING_DIRECTORY"/*

      - name: Verify source tag and signing policy
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ./scripts/check_release_consistency.sh
          ./scripts/release_preflight.sh --tag "$RELEASE_TAG"

      - name: Build local artifacts without Git mutation
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          LIMA_RELEASE_SKIP_PREFLIGHT: "1"
        run: |
          set -euo pipefail
          ./scripts/release_build.sh --tag "$RELEASE_TAG"

      - name: Stage the existing draft
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ./scripts/release_stage.sh --tag "$RELEASE_TAG"
          ./scripts/release_verify.sh --tag "$RELEASE_TAG" --remote-only
