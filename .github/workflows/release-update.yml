name: Publish Update Kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify version and tests
        shell: zsh {0}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION."
            exit 1
          fi
          make test
      - name: Create model-free update kit
        run: ./scripts/create_update_archive.sh dist
      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "RayPlacement $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/RayPlacement-Update.zip dist/RayPlacement-Update.sha256 --clobber
