name: Continuous integration

"on":
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-validation:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate shell syntax
        shell: zsh {0}
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            /bin/zsh -n "$file"
          done

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          brew install actionlint
          actionlint

      - name: Run Swift tests
        run: make test

      - name: Run release metadata and updater tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          ./scripts/check_release_consistency.sh
          ./scripts/test_release_metadata.sh
          ./scripts/test_sparkle_migration.sh
          ./scripts/test_lima_installer.sh
          ./scripts/test_update_verifier.sh
          /bin/zsh ./scripts/test_approved_lima_update.sh

      - name: Run package smoke checks
        shell: zsh {0}
        run: |
          set -euo pipefail
          make build
          test -x .build/debug/RayPlacement
          plutil -lint Packaging/Info.plist
          test -f Package.resolved
