name: Continuous integration

"on":
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-validation:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate shell syntax
        shell: zsh {0}
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            /bin/zsh -n "$file"
          done

      - name: Validate embedded browser release-package gates
        shell: zsh {0}
        run: |
          set -euo pipefail
          /bin/zsh -n scripts/release_build.sh scripts/package_app.sh scripts/package_liamflow_app.sh scripts/create_liamflow_dmg.sh scripts/verify_liamflow_app.sh scripts/verify_liamflow_dmg.sh
          ! /usr/bin/grep -Eq 'LIMA_BROWSER_BRIDGE|SIGNED_XPI|package_browser_bridge|verify_browser_bridge_package' scripts/release_build.sh scripts/package_app.sh scripts/package_liamflow_app.sh scripts/create_liamflow_dmg.sh scripts/verify_liamflow_app.sh scripts/verify_liamflow_dmg.sh
          ! /usr/bin/grep -Eq 'LimaBrowserBridgeHost|BrowserBridge' Package.swift
          /usr/bin/grep -q 'obsolete browser native helper remains' scripts/verify_liamflow_app.sh

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          brew install actionlint
          actionlint

      - name: Run Swift tests
        shell: bash
        run: |
          set -uo pipefail
          make test &
          test_command_pid=$!
          (
            while kill -0 "$test_command_pid" 2>/dev/null; do
              test_pid="$(pgrep -f '[R]ayPlacementPackageTests.xctest/Contents/MacOS/RayPlacementPackageTests' | head -n 1 || true)"
              if [[ -n "$test_pid" ]]; then break; fi
              sleep 1
            done
            [[ -n "${test_pid:-}" ]] || exit 0
            sleep 90
            if kill -0 "$test_pid" 2>/dev/null; then
              echo 'Swift tests have not exited after 90 seconds; capturing diagnostic sample.'
              ps -Ao pid,ppid,state,command | awk '/swiftpm-testing|RayPlacementPackageTests|fake-claude|fake-codex/ { print; if (++count == 80) exit }' || true
              sample "$test_pid" 3 10 -file /tmp/lima-ci-test-stall.sample.txt || true
              if [[ -f /tmp/lima-ci-test-stall.sample.txt ]]; then
                cat /tmp/lima-ci-test-stall.sample.txt
              fi
              kill -TERM "$test_pid" 2>/dev/null || true
              kill -TERM "$test_command_pid" 2>/dev/null || true
            fi
          ) &
          monitor_pid=$!
          wait "$test_command_pid"
          result=$?
          kill -TERM "$monitor_pid" 2>/dev/null || true
          exit "$result"

      - name: Validate extension manifests against the public schema
        shell: bash
        run: |
          set -euo pipefail
          validator_venv="$RUNNER_TEMP/lima-extension-schema"
          python3 -m venv "$validator_venv"
          "$validator_venv/bin/python" -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          "$validator_venv/bin/python" scripts/validate_extension_schema.py

      - name: Run release metadata and updater tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          ./scripts/check_release_consistency.sh
          ./scripts/test_release_metadata.sh
          ./scripts/test_sparkle_migration.sh
          ./scripts/test_lima_installer.sh
          ./scripts/test_update_verifier.sh
          /bin/zsh ./scripts/test_approved_lima_update.sh
          ./scripts/test_cloud_release_configuration.sh
          ./scripts/test_deploy_release.sh

      - name: Run package smoke checks
        shell: zsh {0}
        run: |
          set -euo pipefail
          make build
          test -x .build/debug/RayPlacement
          plutil -lint Packaging/Info.plist
          test -f Package.resolved
