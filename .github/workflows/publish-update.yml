name: Publish RayPlacement Update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Confirm the tag matches the app version
        shell: zsh
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          [[ "$TAG_VERSION" == "$APP_VERSION" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION."
            exit 1
          }

      - name: Create the model-free update kit
        run: scripts/create_update_archive.sh dist

      - name: Publish the GitHub Release and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RayPlacement ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/RayPlacement-Update.zip \
            dist/RayPlacement-Update.sha256
